name: Build LENDAS PrivateLink Firmware 1.2.1 BLE Security

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-lendas-private-link-research.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-private-link-firmware-1-2-1-ble-security

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build ESP32-S3 N16R8 research firmware
        working-directory: private_link_firmware
        run: pio run -e esp32s3_n16r8

      - name: Collect binaries
        shell: bash
        run: |
          set -euxo pipefail
          BUILD="private_link_firmware/.pio/build/esp32s3_n16r8"
          mkdir -p out
          cp "$BUILD/firmware.bin" out/LENDAS_PrivateLink_v1_2_1_APP_PLACEHOLDER.bin
          cp "$BUILD/bootloader.bin" out/bootloader.bin
          cp "$BUILD/partitions.bin" out/partitions.bin
          BOOT_APP0="$(find ~/.platformio/packages -name boot_app0.bin | head -n 1)"
          test -n "$BOOT_APP0"
          cp "$BOOT_APP0" out/boot_app0.bin
          ESPTOOL="$(find ~/.platformio/packages -type f -name esptool.py | head -n 1)"
          test -n "$ESPTOOL"
          python "$ESPTOOL" --chip esp32s3 merge_bin -o out/LENDAS_PrivateLink_v1_2_1_FULL_PLACEHOLDER.bin \
            0x0 out/bootloader.bin \
            0x8000 out/partitions.bin \
            0xE000 out/boot_app0.bin \
            0x10000 out/LENDAS_PrivateLink_v1_2_1_APP_PLACEHOLDER.bin
          sha256sum out/*.bin > out/SHA256SUMS.txt

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: LENDAS_PrivateLink_v1_2_1_Placeholder
          path: out/
          if-no-files-found: error
          retention-days: 7
