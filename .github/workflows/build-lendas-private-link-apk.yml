name: Build LENDAS PrivateLink APK v1.1

on:
  push:
    branches:
      - main
      - chatgpt-private-link-apk
    paths:
      - '.github/workflows/build-lendas-private-link-apk.yml'
      - 'private_link_android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout APK branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-private-link-apk

      - name: Normalize generated source
        shell: python
        run: |
          from pathlib import Path
          p = Path("private_link_android/app/src/main/java/com/lendas/privatelink/MainActivity.java")
          s = p.read_text(encoding="utf-8")
          s = s.replace("private static final int OTA_CHUNK = 180;\\n    private static final int MAX_WRITE_START_RETRIES = 8;",
                        "private static final int OTA_CHUNK = 180;\n    private static final int MAX_WRITE_START_RETRIES = 8;")
          p.write_text(s, encoding="utf-8")

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release APK
        working-directory: private_link_android
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: |
          cp private_link_android/app/build/outputs/apk/release/app-release.apk LENDAS_PrivateLink.apk
          sha256sum LENDAS_PrivateLink.apk | tee LENDAS_PrivateLink.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LENDAS_PrivateLink_APK
          path: |
            LENDAS_PrivateLink.apk
            LENDAS_PrivateLink.sha256
          if-no-files-found: error
          retention-days: 7
