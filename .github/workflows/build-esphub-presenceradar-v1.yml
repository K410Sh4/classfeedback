name: Build ESPhub PresenceRadar V1

on:
  push:
    branches: [esphub-presenceradar-v1]
    paths:
      - 'esphub-presenceradar/**'
      - '.github/workflows/build-esphub-presenceradar-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Compile three ESP32 FULL images
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified PresenceRadar sources
        shell: bash
        run: |
          set -euo pipefail
          cat esphub-presenceradar/source.part*.b64 | tr -d '\n' | base64 -d > /tmp/presenceradar.tar.xz
          echo '8aab3f6275c5f2fb99d008ff83d8cd5c52b9bfc84c20cd02140d74c2631a6466  /tmp/presenceradar.tar.xz' | sha256sum -c -
          tar -xJf /tmp/presenceradar.tar.xz -C .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install firmware toolchain
        run: python -m pip install --upgrade platformio esptool
      - name: Apply CSI SDK compatibility and S3 N16R8 flash profile
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/dump_ack_en = false;/d' firmware/src/presence_radar.cpp
          sed -i '/^board_upload.flash_size = 16MB$/a board_build.flash_size = 16MB' firmware/platformio.ini
          grep -q '^board_build.flash_size = 16MB$' firmware/platformio.ini
      - name: Compile S3 C6 DevKit and generate FULL images
        run: python scripts/build_firmware.py
      - name: SHA-256 manifests
        run: |
          cd dist
          sha256sum *.bin > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ESPhub-PresenceRadar-V1-3-FULL-BIN
          path: |
            dist/*FULL*.bin
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  android:
    name: Compile PresenceRadar Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified PresenceRadar sources
        shell: bash
        run: |
          set -euo pipefail
          cat esphub-presenceradar/source.part*.b64 | tr -d '\n' | base64 -d > /tmp/presenceradar.tar.xz
          echo '8aab3f6275c5f2fb99d008ff83d8cd5c52b9bfc84c20cd02140d74c2631a6466  /tmp/presenceradar.tar.xz' | sha256sum -c -
          tar -xJf /tmp/presenceradar.tar.xz -C .
          mkdir -p android/app/src/main/java/com/esphub/app/protocol
          cp esphub-presenceradar/android-protocol/*.kt android/app/src/main/java/com/esphub/app/protocol/
          test "$(find android/app/src/main/java/com/esphub/app/protocol -name '*.kt' | wc -l)" -eq 3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Collect APK and checksums
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/ESPhub_PresenceRadar_V1_debug.apk
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ESPhub-PresenceRadar-V1-APK
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
