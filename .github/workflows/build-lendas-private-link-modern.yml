name: Build ESPhub APK 2.5.0 LabTest V1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-lendas-private-link-modern.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout modern app branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-esphub-app-2-5-labtest

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Materialize ESPhub launcher icon
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p private_link_android_modern/app/src/main/res/drawable
          base64 -d             private_link_android_modern/branding/esphub_icon_192.webp.b64             > private_link_android_modern/app/src/main/res/drawable/esphub_icon.webp

      - name: Build ESPhub release APK
        working-directory: private_link_android_modern
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: |
          cp private_link_android_modern/app/build/outputs/apk/release/app-release.apk ESPhub_2_5_0.apk
          sha256sum ESPhub_2_5_0.apk | tee ESPhub_2_5_0.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ESPhub_2_5_0_APK
          path: |
            ESPhub_2_5_0.apk
            ESPhub_2_5_0.sha256
          if-no-files-found: error
          retention-days: 7
