name: Build LENDAS PrivateLink Modern APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-lendas-private-link-modern.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout modern app branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-private-link-modern-app

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build modern release APK
        working-directory: private_link_android_modern
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: |
          cp private_link_android_modern/app/build/outputs/apk/release/app-release.apk LENDAS_PrivateLink_2_0.apk
          sha256sum LENDAS_PrivateLink_2_0.apk | tee LENDAS_PrivateLink_2_0.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LENDAS_PrivateLink_2_0_APK
          path: |
            LENDAS_PrivateLink_2_0.apk
            LENDAS_PrivateLink_2_0.sha256
          if-no-files-found: error
          retention-days: 7
