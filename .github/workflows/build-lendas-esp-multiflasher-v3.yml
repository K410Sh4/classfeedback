name: Build ESPhub MultiFlasher v4.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-lendas-esp-multiflasher-v3.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout flasher branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-esphub-multiflasher-v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyserial==3.5 esptool==4.8.1 pyinstaller==6.16.0

      - name: Validate Python source
        shell: pwsh
        run: python -m py_compile private_link_multiflasher_v3/main.py

      - name: Build one-file Windows executable
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name ESPhub_MultiFlasher_v4_1 --collect-all esptool --collect-all serial private_link_multiflasher_v3/main.py

      - name: Smoke test embedded esptool helper
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\dist\ESPhub_MultiFlasher_v4_1.exe' -ArgumentList '--esptool','version' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Embedded esptool smoke test failed with exit code $($p.ExitCode)" }

      - name: Package final artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item '.\dist\ESPhub_MultiFlasher_v4_1.exe' '.\out\ESPhub_MultiFlasher_v4_1.exe'
          $hash = (Get-FileHash '.\out\ESPhub_MultiFlasher_v4_1.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  ESPhub_MultiFlasher_v4_1.exe" | Out-File -Encoding ascii '.\out\ESPhub_MultiFlasher_v4_1.sha256'

      - name: Upload MultiFlasher
        uses: actions/upload-artifact@v4
        with:
          name: ESPhub_MultiFlasher_v4_1
          path: out/
          if-no-files-found: error
          retention-days: 7
