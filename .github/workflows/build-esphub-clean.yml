name: Build ESPhub Clean App 1.0.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-esphub-clean.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout clean ESPhub branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-esphub-clean-app-v1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Materialize launcher icon
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p esphub_android_clean/app/src/main/res/drawable
          base64 -d             esphub_android_clean/branding/esphub_icon.webp.b64             > esphub_android_clean/app/src/main/res/drawable/esphub_icon.webp

      - name: Build release APK
        working-directory: esphub_android_clean
        run: gradle --no-daemon :app:assembleRelease

      - name: Package APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          cp             esphub_android_clean/app/build/outputs/apk/release/app-release.apk             out/ESPhub_Clean_1_0_1.apk
          sha256sum out/ESPhub_Clean_1_0_1.apk             > out/ESPhub_Clean_1_0_1.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ESPhub_Clean_1_0_1_APK
          path: out/
          if-no-files-found: error
          retention-days: 7
